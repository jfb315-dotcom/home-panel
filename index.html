<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Home Panel">
<meta name="panel-version" content="2026-11-21.10">
<link rel="apple-touch-icon" href="icon.png">
<script>
// Simple look: no web font, sky, see-through tiles or frame (the look from before the photo picker broke).
var SIMPLE=false;try{SIMPLE=localStorage.getItem("panel-simple")==="1";}catch(e){}
if(!SIMPLE)document.write('<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">');
</script>
<title>Home Panel</title>
<style>
/* Built for iPad mini 2 on iOS 12: no flex gap, no ?. or ??, no inset, no clamp(). */
:root{--tileA:rgba(16,22,36,.64);--bg:#0E1420;--tile:#182131;--tile2:#243045;--ink:#F2F4F7;--muted:#A7B0BF;--accent:#F5A524;--onaccent:#1A1206;--accentTxt:#F5A524;--line:#2E3A4B}
body.light{--tileA:rgba(255,255,255,.80);--bg:#EEF1F5;--tile:#FFFFFF;--tile2:#E3E8EF;--ink:#141A24;--muted:#556070;--accent:#F5A524;--onaccent:#1A1206;--accentTxt:#9A5A00;--line:#D5DCE5}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:Nunito,-apple-system,BlinkMacSystemFont,"Helvetica Neue",Helvetica,Arial,sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overflow:hidden;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
button{border:0;background:none;padding:0;margin:0;text-align:left;cursor:pointer;-webkit-appearance:none;border-radius:0}
button:active{opacity:.7}
svg{display:block}
#home{position:fixed;z-index:1;top:0;left:0;right:0;bottom:0;padding:36px 26px 26px;display:flex;flex-direction:column;box-sizing:border-box}
header{display:flex;align-items:flex-end;justify-content:space-between;height:72px;margin-bottom:14px;flex:none}
.clock{color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.45);font-size:62px;font-weight:700;line-height:1;letter-spacing:-.02em}
.clock small{font-size:24px;font-weight:700;margin-left:6px;letter-spacing:0;color:rgba(255,255,255,.85)}
.hdate{font-size:21px;color:rgba(255,255,255,.95);text-shadow:0 1px 6px rgba(0,0,0,.5);font-weight:600;margin-top:6px}
.hright{display:flex;align-items:center}
.pill{height:52px;padding:0 20px;border-radius:999px;background:var(--tileA);font-size:17px;font-weight:600;display:flex;align-items:center;margin-left:12px}
.pill svg{margin-right:8px}
.gag{background:var(--accent);color:var(--onaccent)}
.grid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);grid-gap:12px}
#sky{position:fixed;top:0;left:0;right:0;bottom:0;z-index:0;overflow:hidden;background:#0B1736}
#skyBody{position:absolute;top:0;left:0;right:0;bottom:0}
#skyFx{position:absolute;top:0;left:0;width:100%;height:100%}
#flash{position:absolute;top:0;left:0;right:0;bottom:0;background:#fff;opacity:0;-webkit-transition:opacity .08s;transition:opacity .08s}
.cloud{position:absolute;left:0;-webkit-animation:drift linear infinite;animation:drift linear infinite}
.fog{position:absolute;left:-50%;width:200%;height:18%;background:linear-gradient(to bottom,rgba(255,255,255,0),rgba(230,235,240,.35),rgba(255,255,255,0));-webkit-animation:fogmove ease-in-out infinite alternate;animation:fogmove ease-in-out infinite alternate}
.tw{-webkit-animation:tw 3s ease-in-out infinite alternate;animation:tw 3s ease-in-out infinite alternate}
@-webkit-keyframes drift{from{-webkit-transform:translate3d(-560px,0,0)}to{-webkit-transform:translate3d(1600px,0,0)}}
@keyframes drift{from{transform:translate3d(-560px,0,0)}to{transform:translate3d(1600px,0,0)}}
@-webkit-keyframes fogmove{from{-webkit-transform:translate3d(-8%,0,0)}to{-webkit-transform:translate3d(8%,0,0)}}
@keyframes fogmove{from{transform:translate3d(-8%,0,0)}to{transform:translate3d(8%,0,0)}}
@-webkit-keyframes tw{from{opacity:.15}to{opacity:1}}
@keyframes tw{from{opacity:.15}to{opacity:1}}
.tile{background:var(--tileA);border-radius:20px;padding:20px;box-sizing:border-box;display:flex;align-items:center;overflow:hidden;position:relative;min-width:0;min-height:0;width:100%;height:100%}
.span2{grid-column:span 2}
.col{display:flex;flex-direction:column;justify-content:center;min-width:0}
.lbl{font-size:14px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.big{font-size:72px;font-weight:600;line-height:1;letter-spacing:-.02em}
.sub{font-size:18px;color:var(--muted);margin-top:6px}
.mr{margin-right:22px;flex:none}
.wxicon{color:var(--accentTxt)}
#tTimer{flex-direction:column;align-items:stretch;justify-content:flex-start}
.tbtns{flex:1;display:flex;margin-top:12px}
.tbtn{flex:1;border-radius:14px;background:var(--accent);color:var(--onaccent);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:36px;font-weight:700;margin-left:10px}
.tbtn:first-child{margin-left:0}
.tbtn span{font-size:13px;font-weight:700;letter-spacing:.06em}
.trun{flex:1;margin-top:12px;border-radius:14px;background:var(--tile2);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:54px;font-weight:700}
.trun span{font-size:15px;font-weight:600;color:var(--muted)}
#tVerse{flex-direction:column;align-items:flex-start;justify-content:center}
#verseText{font-size:22px;line-height:1.35;margin:8px 0 6px}
.ref{font-size:16px;color:var(--muted)}
#tCount .big{color:var(--accentTxt)}
#tPhoto{padding:0;background:var(--tile2);background-size:cover;background-position:center;justify-content:center;flex-direction:column;color:var(--muted)}
.ptag{position:absolute;left:12px;bottom:12px;background:rgba(0,0,0,.6);color:#fff;font-size:14px;font-weight:600;padding:6px 10px;border-radius:999px}
.qrbox{background:#fff;border-radius:8px;padding:0;flex:none}
/* Full-screen views */
.view{position:fixed;top:0;left:0;right:0;bottom:0;background:var(--bg);display:none;flex-direction:column;z-index:10}
.view.on{display:flex}
.vbar{height:96px;padding:0 24px;display:flex;align-items:center;flex:none}
.back{height:60px;padding:0 24px 0 16px;border-radius:16px;background:var(--tile);font-size:21px;font-weight:600;display:flex;align-items:center}
.vbar h1{font-size:30px;margin:0 0 0 20px;font-weight:700}
.vbody{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 24px 24px;box-sizing:border-box}
.card{background:var(--tile);border-radius:20px;padding:24px;margin-bottom:12px}
.row{display:flex;align-items:center}
.btn{height:60px;padding:0 28px;border-radius:16px;background:var(--tile2);font-size:20px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;margin:0 12px 12px 0}
.btn.pri{background:var(--accent);color:var(--onaccent)}
.btn.warn{background:#C0392B;color:#fff}
.field{display:block;margin-bottom:16px}
.field span{display:block;font-size:15px;color:var(--muted);font-weight:600;margin-bottom:6px}
.field input,.field select{width:100%;box-sizing:border-box;height:56px;border-radius:12px;border:1px solid var(--line);background:var(--bg);padding:0 14px;font-size:20px;-webkit-appearance:none}
.hours{display:flex;overflow-x:auto;-webkit-overflow-scrolling:touch}
.hr{flex:none;width:76px;text-align:center;font-size:17px}
.hr .t{color:var(--muted);font-size:15px}
.hr svg{margin:8px auto}
.drow{display:flex;align-items:center;padding:12px 0;border-top:1px solid var(--line);font-size:20px}
.drow:first-child{border-top:0}
.drow .d{width:120px;font-weight:600}
.drow .p{width:90px;color:var(--muted);text-align:right}
.drow .hl{flex:1;text-align:right}
.bigtime{font-size:200px;font-weight:700;letter-spacing:-.03em;line-height:1;text-align:center;margin:24px 0}
.center{text-align:center}
.crow{display:flex;align-items:center;padding:16px 0;border-top:1px solid var(--line)}
.crow:first-child{border-top:0}
.crow .n{flex:1;font-size:22px;font-weight:600}
.crow .n small{display:block;font-size:16px;color:var(--muted);font-weight:400;margin-top:2px}
.crow .dd{font-size:34px;font-weight:700;color:var(--accentTxt);margin-right:16px}
#v-photo{background:#000;color:#fff}
#v-photo .back{background:#222;color:#fff}
#photoBig{flex:1;background-size:contain;background-repeat:no-repeat;background-position:center;margin:0 24px}
.pbar{display:flex;align-items:center;justify-content:center;padding:12px 24px 20px;flex:none}
.pbar .btn{background:#222;color:#fff;margin:0 6px}
.simple #frame,.simple #sky{display:none}
.simple .tile,.simple .pill{background:var(--tile)}
.simple .clock,.simple .hdate{color:var(--ink);text-shadow:none}
.simple .clock small,.simple .hdate{color:var(--muted)}
.simple #home{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Helvetica,Arial,sans-serif}
#frame{position:fixed;top:6px;left:6px;right:6px;bottom:6px;border-radius:26px;box-shadow:0 0 0 40px #000;pointer-events:none;z-index:200}
#toast{position:fixed;left:50%;bottom:40px;-webkit-transform:translateX(-50%);transform:translateX(-50%);background:#000;color:#fff;font-size:22px;font-weight:600;padding:16px 28px;border-radius:999px;z-index:50;opacity:0;-webkit-transition:opacity .25s;transition:opacity .25s;pointer-events:none;white-space:nowrap}
#toast.on{opacity:.9}
.ring{color:var(--accentTxt)}
.buzz{flex:1;height:180px;border-radius:22px;color:#fff;font-size:36px;font-weight:800;text-align:center;-webkit-touch-callout:none}
.hb.btn{margin:0 0 0 10px}
.fcard{text-align:left}
.fgrid{display:grid;grid-template-columns:repeat(3,1fr);grid-gap:12px;margin-bottom:12px}
.fl{background:var(--tile);border-radius:20px;padding:20px 22px;min-height:104px;box-sizing:border-box}
.sbtn{width:78px;height:66px;border-radius:14px;background:rgba(255,255,255,.22);color:#fff;font-size:28px;font-weight:800;text-align:center;margin:0 5px}
#drawBox{flex:1;margin:0 24px;border-radius:16px;overflow:hidden;background:#fff;min-height:0}
#drawCanvas{display:block;touch-action:none}
#drawBar{display:flex;align-items:center;padding:14px 24px 20px;flex:none}
@media (orientation:portrait){
  .grid{grid-template-columns:repeat(2,1fr);grid-template-rows:none;grid-auto-rows:1fr;grid-auto-flow:dense}
  .bigtime{font-size:150px}
}
</style>
</head>
<body>
<div id="sky"><div id="skyBody"></div><canvas id="skyFx"></canvas><div id="flash"></div></div>
<div id="home">
  <header>
    <div>
      <div class="clock" id="clock">--:--</div>
      <div class="hdate" id="hdate"></div>
    </div>
    <div class="hright">
      <button class="pill" id="themeBtn" aria-label="Screen color: automatic, day or night"></button>
      <button class="pill" data-act="toBedside" aria-label="Switch to the bedside clock">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"></path></svg>
        Bedside
      </button>
      <button class="pill" data-open="fun" aria-label="Fun: trivia, joke and word of the day">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="3"></rect><path d="M9 9h.01M15 15h.01M15 9h.01M9 15h.01M12 12h.01" stroke-width="3"></path></svg>
        Fun
      </button>
      <button class="pill gag" id="gagBtn" aria-label="Gag button">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M8 14a4.5 4.5 0 0 0 8 0z"></path><path d="M9 9.5h.01M15 9.5h.01"></path></svg>
        Don't press
      </button>
    </div>
  </header>
  <div class="grid">
    <button class="tile span2" id="tWeather" data-open="weather" aria-label="Weather"></button>
    <div class="tile" id="tTimer"></div>
    <button class="tile span2" id="tVerse" data-open="verse" aria-label="Verse of the day">
      <div class="lbl">Verse of the day</div>
      <div id="verseText"></div>
      <div class="ref" id="verseRef"></div>
    </button>
    <button class="tile" id="tCount" data-open="count" aria-label="Countdown"></button>
    <button class="tile" id="tPhoto" data-open="photo" aria-label="Photo of the day"></button>
    <button class="tile" id="tMoon" data-open="moon" aria-label="Moon and stars"></button>
    <button class="tile" id="tWord" data-open="fun" aria-label="Word of the day"></button>
  </div>
</div>

<section class="view" id="v-weather"><div class="vbar"><button class="back" data-back>BACKICON Back</button><h1>Weather</h1></div><div class="vbody" id="wxBody"></div></section>
<section class="view" id="v-timer"><div class="vbar"><button class="back" data-back>BACKICON Back</button><h1>Timer</h1></div><div class="vbody" id="timerBody"></div></section>
<section class="view" id="v-verse"><div class="vbar"><button class="back" data-back>BACKICON Back</button><h1>Verse of the day</h1></div><div class="vbody" id="verseBody"></div></section>
<section class="view" id="v-count"><div class="vbar"><button class="back" data-back>BACKICON Back</button><h1>Countdowns</h1></div><div class="vbody" id="countBody"></div></section>
<section class="view" id="v-moon"><div class="vbar"><button class="back" data-back>BACKICON Back</button><h1>Moon and stars</h1></div><div class="vbody" id="moonBody"></div></section>
<section class="view" id="v-wifi"><div class="vbar"><button class="back" data-back>BACKICON Back</button><h1>Guest Wi-Fi</h1></div><div class="vbody" id="wifiBody"></div></section>
<section class="view" id="v-fun"><div class="vbar"><button class="back" data-back>BACKICON Back</button><h1>Fun</h1></div><div class="vbody" id="funBody"></div></section>
<section class="view" id="v-trivia"><div class="vbar"><button class="back" data-back>BACKICON Back</button><h1>Trivia night</h1><button class="btn" data-act="qnew" style="margin:0 0 0 auto">New game</button></div><div class="vbody" id="triviaBody"></div></section>
<section class="view" id="v-score"><div class="vbar"><button class="back" data-back>BACKICON Back</button><h1>Scoreboard</h1><div class="sub" style="margin:0 0 0 16px">Tap a team name to rename it</div></div><div class="vbody" id="scoreBody"></div></section>
<section class="view" id="v-dice"><div class="vbar"><button class="back" data-back>BACKICON Back</button><h1>Dice and coin</h1></div><div class="vbody" id="diceBody"></div></section>
<section class="view" id="v-draw"><div class="vbar"><button class="back" data-back>BACKICON Back</button><h1>Drawing pad</h1></div><div id="drawBox"><canvas id="drawCanvas"></canvas></div><div id="drawBar"></div></section>
<section class="view" id="v-movie"><div class="vbar"><button class="back" data-back>BACKICON Back</button><h1>Movie night picker</h1></div><div class="vbody" id="movieBody"></div></section>
<section class="view" id="v-photo"><div class="vbar"><button class="back" data-back>BACKICON Back</button><h1 id="photoTitle">Photos</h1></div><div id="photoBig"></div><div class="pbar" id="photoBar"></div></section>

<input type="file" id="photoInput" accept="image/*" multiple style="display:none">
<div id="toast"></div>
<div id="frame"></div>

<script>

//
// QR Code Generator for JavaScript
//
// Copyright (c) 2009 Kazuhiko Arase
//
// URL: http://www.d-project.com/

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;

        var b0 = bin.read();

        var b2 = read();
        var b3 = read();

        var v = (b2 << 8) | b3;

      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);

          }

function fart(){

 var t=a.currentTime+0.03,dur=0.5+Math.random()*1.1;
 var o=a.createOscillator();o.type="sawtooth";var f0=70+Math.random()*50;o.frequency.setValueAtTime(f0,t);o.frequency.linearRampToValueAtTime(f0*(0.55+Math.random()*0.3),t+dur);
 var lfo=a.createOscillator();lfo.type="square";lfo.frequency.setValueAtTime(14+Math.random()*16,t);lfo.frequency.linearRampToValueAtTime(7+Math.random()*8,t+dur);
 var depth=a.createGain();depth.gain.value=0.5;var amp=a.createGain();amp.gain.value=0.5;lfo.connect(depth);depth.connect(amp.gain);
 var lp=a.createBiquadFilter();lp.type="lowpass";lp.frequency.value=380+Math.random()*260;lp.Q.value=4;
 var env=a.createGain();env.gain.setValueAtTime(0,t);env.gain.linearRampToValueAtTime(1,t+0.03);env.gain.setValueAtTime(1,t+dur*0.7);env.gain.linearRampToValueAtTime(0,t+dur);
 var len=Math.floor(a.sampleRate*dur),nb=a.createBuffer(1,len,a.sampleRate),ch=nb.getChannelData(0);for(var i=0;i<len;i++)ch[i]=Math.random()*2-1;
 var ns=a.createBufferSource();ns.buffer=nb;var bp=a.createBiquadFilter();bp.type="bandpass";bp.frequency.value=180;bp.Q.value=1.2;var ng=a.createGain();ng.gain.value=0.35;
 o.connect(amp);amp.connect(lp);ns.connect(bp);bp.connect(ng);ng.connect(lp);lp.connect(env);env.connect(a.destination);
 o.start(t);lfo.start(t);ns.start(t);o.stop(t+dur+0.05);lfo.stop(t+dur+0.05);ns.stop(t+dur+0.05);
 return dur;
}

var SYN=29.530588853, NEW_REF=Date.UTC(2000,0,6,18,14); // a known new moon

function phaseName(p){
 if(p<0.0339||p>0.9661)return "New moon";if(p<0.2161)return "Waxing crescent";if(p<0.2839)return "First quarter";
 if(p<0.4661)return "Waxing gibbous";if(p<0.5339)return "Full moon";if(p<0.7161)return "Waning gibbous";if(p<0.7839)return "Last quarter";return "Waning crescent";
}
function moonSvg(p,size){
 var R=45,cx=50,cy=50,k=Math.cos(2*Math.PI*p),rx=Math.abs(k)*R,right=p<0.5,lit;
 var dark=document.body.className==="light"?"#C9D1DC":"#2A3446";
 var outer=right?1:0,inner=k>0?(right?0:1):(right?1:0);
 if(p<0.0339||p>0.9661)lit="";
 else if(Math.abs(p-0.5)<0.0339)lit='<circle cx="50" cy="50" r="45" fill="#F2E7C4"/>';
 else lit='<path d="M50 5 A45 45 0 0 '+outer+' 50 95 A'+rx.toFixed(2)+' 45 0 0 '+inner+' 50 5z" fill="#F2E7C4"/>';
 return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="45" fill="'+dark+'"/>'+lit+'</svg>';
}

function shrink(file){
 return new Promise(function(res){
  var fr=new FileReader();
  fr.onload=function(){var img=new Image();img.onload=function(){
    var max=1280,w=img.width,h=img.height,sc=Math.min(1,max/Math.max(w,h)),c=document.createElement("canvas");
    c.width=Math.round(w*sc);c.height=Math.round(h*sc);c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    res(c.toDataURL("image/jpeg",0.82));};img.onerror=function(){res(null);};img.src=fr.result;};
  fr.onerror=function(){res(null);};fr.readAsDataURL(file);
 });
}

 var q=left[Math.floor(Math.random()*left.length)];used.push(q);lsSet("trivia-used",used);
 trivia.q=q;trivia.order=shuffled(4);trivia.state="open";trivia.buzzed=-1;trivia.locked=[];
}

 if(name==="wifi"){wifiEdit=false;renderWifi();}
 if(name==="fun")renderFun();
 if(name==="trivia")renderTrivia();
 if(name==="score"){scoreResetArm=false;renderScore();}
 if(name==="dice")renderDice();
 if(name==="draw")renderDrawBar();
 if(name==="movie"){movieRmArm=null;renderMovie();}
 $("v-"+name).className="view on";var sc=$("v-"+name).querySelector(".vbody, #photoBig");if(sc)sc.scrollTop=0;
 if(name==="draw")setupCanvas();
}
function closeView(){if(view==="photo")pauseSky(false);if(view)$("v-"+view).className="view";view=null;}
document.addEventListener("click",function(e){
 var t=e.target;while(t&&t!==document&&!(t.getAttribute&&(t.hasAttribute("data-open")||t.hasAttribute("data-timer")||t.hasAttribute("data-act")||t.hasAttribute("data-back"))))t=t.parentNode;
 if(!t||t===document)return;
 if(t.hasAttribute("data-back")){if(timer&&timer.ringing){timer=null;}closeView();renderTimerTile();return;}
 if(t.hasAttribute("data-timer")){startTimer(+t.getAttribute("data-timer"));return;}
 if(t.hasAttribute("data-open")){var n=t.getAttribute("data-open");if(n==="photo"&&!photos.length&&db){openView("photo");$("photoInput").click();return;}openView(n);return;}
 var a=t.getAttribute("data-act");
 if(a==="toBedside"){if(timer){toast("Stop the timer first");return;}if(trivia&&trivia.winner==null&&!toBedArm){toBedArm=true;toast("Tap again to leave the trivia game");setTimeout(function(){toBedArm=false;},3000);return;}location.href="bedside/";return;}
 if(a==="latest"){getLatest();return;}
 if(a==="simple"){try{localStorage.setItem("panel-simple",SIMPLE?"0":"1");}catch(e){}toast(SIMPLE?"Turning the sky back on…":"Switching to the simple look…");setTimeout(function(){location.replace(location.pathname+"?v="+Date.now());},700);return;}
 if(a==="joke"){jokeShown=!jokeShown;renderFun();return;}
 if(a.charAt(0)==="q"&&triviaAct(a,t))return;
 if(scoreAct(a,t)||diceAct(a,t)||drawAct(a,t)||movieAct(a,t))return;
 if(a==="tpause"&&timer){if(timer.paused){timer.end=Date.now()+timer.left;timer.paused=false;}else{timer.left=timeLeft();timer.paused=true;}tickTimer();}
 else if(a==="tadd"&&timer){if(timer.paused)timer.left+=60000;else timer.end+=60000;tickTimer();}
 else if(a==="tcancel"||a==="tstop"){timer=null;closeView();renderTimerTile();}
 else if(a==="cdadd")addCount();
 else if(a==="cdrm"){var id=+t.getAttribute("data-id");if(removeArm===id){countList=countList.filter(function(x){return x.id!==id;});lsSet("cd-list",countList);removeArm=null;toast("Removed");}else removeArm=id;renderCount();}
 else if(a==="padd")$("photoInput").click();
 else if(a==="pprev"){photoIdx=(photoIdx-1+photos.length)%photos.length;photoRmArm=false;renderPhotoView();}
 else if(a==="pnext"){photoIdx=(photoIdx+1)%photos.length;photoRmArm=false;renderPhotoView();}
 else if(a==="prm"){if(photoRmArm){var p=photos[photoIdx];idbReq("readwrite",function(s){return s["delete"](p.id);}).then(function(){photos.splice(photoIdx,1);photoRmArm=false;renderPhotoView();renderPhotoTile();toast("Photo removed");});}else{photoRmArm=true;renderPhotoView();}}
 else if(a==="wedit"){wifiEdit=true;renderWifi();}
 else if(a==="wcancel"){wifiEdit=false;renderWifi();}
 else if(a==="wsave"){var s=($("wSsid").value||"").trim();if(!s){toast("Type the network name");return;}wifi={ssid:s.slice(0,32),pass:$("wPass").value||"",sec:$("wSec").value};lsSet("wifi",wifi);wifiEdit=false;renderWifi();toast("Saved");}
},false);
["touchstart","mousedown","keydown"].forEach(function(ev){document.addEventListener(ev,function(){lastTouch=Date.now();},true);});
// Back to the home screen after 1 minute untouched; a running timer stays; trivia, scoreboard and drawing get 10 minutes.
setInterval(function(){var lim=((view==="trivia"&&trivia&&trivia.winner==null)||view==="score"||view==="draw")?600000:60000;if(view&&Date.now()-lastTouch>lim&&!(view==="timer"&&timer))closeView();},5000);


/* ---------- Self-update ---------- */
// Home Screen apps on iOS 12 keep their old copy, so check the live page and reload when the version changes.
var APP_VERSION=document.querySelector('meta[name="panel-version"]').getAttribute("content");
function checkUpdate(){
 if(!window.fetch)return;
 fetch(location.pathname+"?check="+Date.now(),{cache:"no-store"}).then(function(r){return r.ok?r.text():"";}).then(function(t){
  var m=t.match(/name="panel-version" content="([^"]+)"/);
  if(!m||m[1]===APP_VERSION)return;
  // Only when nobody is using it: home screen showing, no timer, no trivia game going.
  if(view||timer||(trivia&&trivia.winner==null)||Date.now()-lastTouch<60000){setTimeout(checkUpdate,60000);return;}
  location.replace(location.pathname+"?v="+encodeURIComponent(m[1]));
 }).catch(function(){});
}
setTimeout(checkUpdate,10000);setInterval(checkUpdate,15*60000);
// Also check whenever the app is reopened or brought back to the front.
document.addEventListener("visibilitychange",function(){if(!document.hidden)setTimeout(checkUpdate,1500);},false);
window.addEventListener("pageshow",function(){setTimeout(checkUpdate,1500);},false);
// A fresh address always gets the newest copy; saved photos and settings stay because they live on this iPad, not in the page.
function getLatest(){toast("Getting the latest version…");setTimeout(function(){location.replace(location.pathname+"?v="+Date.now());},600);}

/* ---------- Start ---------- */
applyTheme();
renderWeather();renderTimerTile();renderWifi();
tickClock();setInterval(tickClock,10000);
setInterval(tickTimer,250);
loadWeather();setInterval(loadWeather,15*60000);
idbOpen().then(function(d){db=d;return idbAll();}).then(function(all){photos=all.map(function(r){return {id:r.id,data:r.data};});renderPhotoTile();}).catch(function(){renderPhotoTile();});
window.addEventListener("resize",function(){skyKey="";renderSky();fitText($("verseText"),22,14);renderWordTile();});
})();
</script>
