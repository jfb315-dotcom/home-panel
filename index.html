<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Home Panel">
<link rel="apple-touch-icon" href="icon.png">
<title>Home Panel</title>
<style>
/* Built for iPad mini 2 on iOS 12: no flex gap, no ?. or ??, no inset, no clamp(). */
:root{--bg:#0E1420;--tile:#182131;--tile2:#243045;--ink:#F2F4F7;--muted:#A7B0BF;--accent:#F5A524;--onaccent:#1A1206;--accentTxt:#F5A524;--line:#2E3A4B}
body.light{--bg:#EEF1F5;--tile:#FFFFFF;--tile2:#E3E8EF;--ink:#141A24;--muted:#556070;--accent:#F5A524;--onaccent:#1A1206;--accentTxt:#9A5A00;--line:#D5DCE5}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Helvetica,Arial,sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overflow:hidden;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
button{border:0;background:none;padding:0;margin:0;text-align:left;cursor:pointer;-webkit-appearance:none;border-radius:0}
button:active{opacity:.7}
svg{display:block}
#home{position:fixed;top:0;left:0;right:0;bottom:0;padding:28px 24px 24px;display:flex;flex-direction:column;box-sizing:border-box}
header{display:flex;align-items:flex-end;justify-content:space-between;height:72px;margin-bottom:14px;flex:none}
.clock{font-size:60px;font-weight:600;line-height:1;letter-spacing:-.02em}
.clock small{font-size:24px;font-weight:600;margin-left:6px;letter-spacing:0;color:var(--muted)}
.hdate{font-size:21px;color:var(--muted);margin-top:6px}
.hright{display:flex;align-items:center}
.pill{height:52px;padding:0 20px;border-radius:999px;background:var(--tile);font-size:17px;font-weight:600;display:flex;align-items:center;margin-left:12px}
.pill svg{margin-right:8px}
.gag{background:var(--accent);color:var(--onaccent)}
.grid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);grid-gap:12px}
.tile{background:var(--tile);border-radius:20px;padding:20px;box-sizing:border-box;display:flex;align-items:center;overflow:hidden;position:relative;min-width:0;min-height:0;width:100%;height:100%}
.span2{grid-column:span 2}
.col{display:flex;flex-direction:column;justify-content:center;min-width:0}
.lbl{font-size:14px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.big{font-size:72px;font-weight:600;line-height:1;letter-spacing:-.02em}
.sub{font-size:18px;color:var(--muted);margin-top:6px}
.mr{margin-right:22px;flex:none}
.wxicon{color:var(--accentTxt)}
#tTimer{flex-direction:column;align-items:stretch;justify-content:flex-start}
.tbtns{flex:1;display:flex;margin-top:12px}
.tbtn{flex:1;border-radius:14px;background:var(--accent);color:var(--onaccent);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:36px;font-weight:700;margin-left:10px}
.tbtn:first-child{margin-left:0}
.tbtn span{font-size:13px;font-weight:700;letter-spacing:.06em}
.trun{flex:1;margin-top:12px;border-radius:14px;background:var(--tile2);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:54px;font-weight:700}
.trun span{font-size:15px;font-weight:600;color:var(--muted)}
#tVerse{flex-direction:column;align-items:flex-start;justify-content:center}
#verseText{font-size:22px;line-height:1.35;margin:8px 0 6px}
.ref{font-size:16px;color:var(--muted)}
#tCount .big{color:var(--accentTxt)}
#tPhoto{padding:0;background:var(--tile2);background-size:cover;background-position:center;justify-content:center;flex-direction:column;color:var(--muted)}
.ptag{position:absolute;left:12px;bottom:12px;background:rgba(0,0,0,.6);color:#fff;font-size:14px;font-weight:600;padding:6px 10px;border-radius:999px}
.qrbox{background:#fff;border-radius:8px;padding:0;flex:none}
/* Full-screen views */
.view{position:fixed;top:0;left:0;right:0;bottom:0;background:var(--bg);display:none;flex-direction:column;z-index:10}
.view.on{display:flex}
.vbar{height:96px;padding:0 24px;display:flex;align-items:center;flex:none}
.back{height:60px;padding:0 24px 0 16px;border-radius:16px;background:var(--tile);font-size:21px;font-weight:600;display:flex;align-items:center}
.vbar h1{font-size:30px;margin:0 0 0 20px;font-weight:700}
.vbody{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 24px 24px;box-sizing:border-box}
.card{background:var(--tile);border-radius:20px;padding:24px;margin-bottom:12px}
.row{display:flex;align-items:center}
.btn{height:60px;padding:0 28px;border-radius:16px;background:var(--tile2);font-size:20px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;margin:0 12px 12px 0}
.btn.pri{background:var(--accent);color:var(--onaccent)}
.btn.warn{background:#C0392B;color:#fff}
.field{display:block;margin-bottom:16px}
.field span{display:block;font-size:15px;color:var(--muted);font-weight:600;margin-bottom:6px}
.field input,.field select{width:100%;box-sizing:border-box;height:56px;border-radius:12px;border:1px solid var(--line);background:var(--bg);padding:0 14px;font-size:20px;-webkit-appearance:none}
.hours{display:flex;overflow-x:auto;-webkit-overflow-scrolling:touch}
.hr{flex:none;width:76px;text-align:center;font-size:17px}
.hr .t{color:var(--muted);font-size:15px}
.hr svg{margin:8px auto}
.drow{display:flex;align-items:center;padding:12px 0;border-top:1px solid var(--line);font-size:20px}
.drow:first-child{border-top:0}
.drow .d{width:120px;font-weight:600}
.drow .p{width:90px;color:var(--muted);text-align:right}
.drow .hl{flex:1;text-align:right}
.bigtime{font-size:200px;font-weight:700;letter-spacing:-.03em;line-height:1;text-align:center;margin:24px 0}
.center{text-align:center}
.crow{display:flex;align-items:center;padding:16px 0;border-top:1px solid var(--line)}
.crow:first-child{border-top:0}
.crow .n{flex:1;font-size:22px;font-weight:600}
.crow .n small{display:block;font-size:16px;color:var(--muted);font-weight:400;margin-top:2px}
.crow .dd{font-size:34px;font-weight:700;color:var(--accentTxt);margin-right:16px}
#v-photo{background:#000;color:#fff}
#v-photo .back{background:#222;color:#fff}
#photoBig{flex:1;background-size:contain;background-repeat:no-repeat;background-position:center;margin:0 24px}
.pbar{display:flex;align-items:center;justify-content:center;padding:12px 24px 20px;flex:none}
.pbar .btn{background:#222;color:#fff;margin:0 6px}
#toast{position:fixed;left:50%;bottom:40px;-webkit-transform:translateX(-50%);transform:translateX(-50%);background:#000;color:#fff;font-size:22px;font-weight:600;padding:16px 28px;border-radius:999px;z-index:50;opacity:0;-webkit-transition:opacity .25s;transition:opacity .25s;pointer-events:none;white-space:nowrap}
#toast.on{opacity:.9}
.ring{color:var(--accentTxt)}
@media (orientation:portrait){
  .grid{grid-template-columns:repeat(2,1fr);grid-template-rows:none;grid-auto-rows:1fr;grid-auto-flow:dense}
  .bigtime{font-size:150px}
}
</style>
</head>
<body>
<div id="home">
  <header>
    <div>
      <div class="clock" id="clock">--:--</div>
      <div class="hdate" id="hdate"></div>
    </div>
    <div class="hright">
      <button class="pill" id="themeBtn" aria-label="Screen color: automatic, day or night"></button>
      <button class="pill gag" id="gagBtn" aria-label="Gag button">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M8 14a4.5 4.5 0 0 0 8 0z"></path><path d="M9 9.5h.01M15 9.5h.01"></path></svg>
        Don't press
      </button>
    </div>
  </header>
  <div class="grid">
    <button class="tile span2" id="tWeather" data-open="weather" aria-label="Weather"></button>
    <div class="tile" id="tTimer"></div>
    <button class="tile span2" id="tVerse" data-open="verse" aria-label="Verse of the day">
      <div class="lbl">Verse of the day</div>
      <div id="verseText"></div>
      <div class="ref" id="verseRef"></div>
    </button>
    <button class="tile" id="tCount" data-open="count" aria-label="Countdown"></button>
    <button class="tile" id="tPhoto" data-open="photo" aria-label="Photo of the day"></button>
    <button class="tile" id="tMoon" data-open="moon" aria-label="Moon and stars"></button>
    <button class="tile" id="tWifi" data-open="wifi" aria-label="Guest Wi-Fi"></button>
  </div>
</div>

<section class="view" id="v-weather"><div class="vbar"><button class="back" data-back>BACKICON Back</button><h1>Weather</h1></div><div class="vbody" id="wxBody"></div></section>
<section class="view" id="v-timer"><div class="vbar"><button class="back" data-back>BACKICON Back</button><h1>Timer</h1></div><div class="vbody" id="timerBody"></div></section>
<section class="view" id="v-verse"><div class="vbar"><button class="back" data-back>BACKICON Back</button><h1>Verse of the day</h1></div><div class="vbody" id="verseBody"></div></section>
<section class="view" id="v-count"><div class="vbar"><button class="back" data-back>BACKICON Back</button><h1>Countdowns</h1></div><div class="vbody" id="countBody"></div></section>
<section class="view" id="v-moon"><div class="vbar"><button class="back" data-back>BACKICON Back</button><h1>Moon and stars</h1></div><div class="vbody" id="moonBody"></div></section>
<section class="view" id="v-wifi"><div class="vbar"><button class="back" data-back>BACKICON Back</button><h1>Guest Wi-Fi</h1></div><div class="vbody" id="wifiBody"></div></section>
<section class="view" id="v-photo"><div class="vbar"><button class="back" data-back>BACKICON Back</button><h1 id="photoTitle">Photos</h1></div><div id="photoBig"></div><div class="pbar" id="photoBar"></div></section>

<input type="file" id="photoInput" accept="image/*" multiple style="display:none">
<div id="toast"></div>

<script>
//---------------------------------------------------------------------

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

}

];
function verseFor(dn){return VERSES[((dn%VERSES.length)+VERSES.length)%VERSES.length];}
function fitText(el,max,min){el.style.fontSize=max+"px";var box=el.parentNode,s=max;while(s>min&&box.scrollHeight>box.clientHeight+1){s--;el.style.fontSize=s+"px";}}
function renderVerse(){
 var dn=dayNum(new Date()),v=verseFor(dn);
 $("verseText").textContent=v[0];$("verseRef").textContent=v[1]+" (KJV)";fitText($("verseText"),22,14);
 var prev="";for(var i=1;i<=3;i++){var p=verseFor(dn-i),d=new Date(Date.now()-i*864e5);prev+='<div class="card"><div class="lbl" style="margin-bottom:8px">'+fmtDay(d)+'</div><div style="font-size:22px;line-height:1.4">'+esc(p[0])+'</div><div class="ref" style="margin-top:8px">'+esc(p[1])+'</div></div>';}
 $("verseBody").innerHTML='<div class="card" style="padding:40px"><div style="font-size:38px;line-height:1.35;font-weight:500">'+esc(v[0])+'</div><div class="ref" style="font-size:22px;margin-top:20px">'+esc(v[1])+' (KJV)</div></div><div class="lbl" style="margin:20px 0 10px">Earlier this week</div>'+prev;
}

/* ---------- Countdowns ---------- */
var countList=lsGet("cd-list",null)||[{id:1,name:"Christmas",m:12,d:25,y:null},{id:2,name:"New Year's Day",m:1,d:1,y:null}];
var removeArm=null;
function cdNext(it){
 var now=new Date(),today=new Date(now.getFullYear(),now.getMonth(),now.getDate());
 var d=new Date(it.y||now.getFullYear(),it.m-1,it.d);
 if(!it.y&&d<today)d=new Date(now.getFullYear()+1,it.m-1,it.d);
 return {date:d,days:Math.round((d-today)/864e5)};
}
function daysWord(n){return n===1?"day":"days";}
function renderCount(){
 var items=countList.map(function(it){var n=cdNext(it);return {it:it,date:n.date,days:n.days};}).sort(function(a,b){return a.date-b.date;});
 var up=items.filter(function(x){return x.days>=0;}),el=$("tCount");
 if(!up.length)el.innerHTML='<div class="mr" style="color:var(--accentTxt)">'+icon("gift",48)+'</div><div class="col"><div style="font-size:22px;font-weight:600">Countdown</div><div class="sub">Tap to add one</div></div>';
 else{var f=up[0];el.innerHTML='<div class="col"><div class="big">'+(f.days===0?"Today!":f.days)+'</div><div class="sub" style="color:var(--ink);font-size:19px">'+(f.days===0?esc(f.it.name):daysWord(f.days)+" until "+esc(f.it.name))+'</div></div>';}
 var rows=items.map(function(x){return '<div class="crow"><div class="dd">'+(x.days<0?"Done":x.days===0?"Today":x.days)+'</div><div class="n">'+esc(x.it.name)+'<small>'+fmtDay(x.date)+(x.it.y?"":" · every year")+(x.days>0?" · "+x.days+" "+daysWord(x.days):"")+'</small></div><button class="btn'+(removeArm===x.it.id?" warn":"")+'" data-act="cdrm" data-id="'+x.it.id+'" style="margin:0">'+(removeArm===x.it.id?"Tap again to remove":"Remove")+'</button></div>';}).join("");
 var y=new Date().getFullYear();
 $("countBody").innerHTML='<div class="card">'+(rows||'<div class="sub">No countdowns yet.</div>')+'</div>'+
  '<div class="card"><div class="lbl" style="margin-bottom:14px">Add a countdown</div><label class="field"><span>What’s it for?</span><input id="cdName" type="text" placeholder="Basketball season opener" autocomplete="off"></label><label class="field"><span>Date</span><input id="cdDate" type="date" min="'+y+'-01-01"></label><label class="row" style="font-size:20px;margin-bottom:18px"><input id="cdYearly" type="checkbox" style="width:28px;height:28px;margin:0 12px 0 0">Every year (birthdays, holidays)</label><button class="btn pri" data-act="cdadd">Add countdown</button></div>';
}
function addCount(){
 var name=($("cdName").value||"").trim(),dv=$("cdDate").value;
 if(!name){toast("Type a name first");return;}
 if(!/^\d{4}-\d{2}-\d{2}$/.test(dv)){toast("Pick a date");return;}
 var p=dv.split("-");
 countList.push({id:Date.now(),name:name.slice(0,40),m:+p[1],d:+p[2],y:$("cdYearly").checked?null:+p[0]});
 lsSet("cd-list",countList);renderCount();toast("Countdown added");
}

/* ---------- Moon and stars ---------- */
var SYN=29.530588853, NEW_REF=Date.UTC(2000,0,6,18,14); // a known new moon
function moonPhase(t){var age=((t-NEW_REF)/864e5)%SYN;if(age<0)age+=SYN;return age/SYN;}
function phaseName(p){
 if(p<0.0339||p>0.9661)return "New moon";if(p<0.2161)return "Waxing crescent";if(p<0.2839)return "First quarter";
 if(p<0.4661)return "Waxing gibbous";if(p<0.5339)return "Full moon";if(p<0.7161)return "Waning gibbous";if(p<0.7839)return "Last quarter";return "Waning crescent";
}
function moonSvg(p,size){
 var R=45,cx=50,cy=50,k=Math.cos(2*Math.PI*p),rx=Math.abs(k)*R,right=p<0.5,lit;
 var dark=document.body.className==="light"?"#C9D1DC":"#2A3446";
 var outer=right?1:0,inner=k>0?(right?0:1):(right?1:0);
 if(p<0.0339||p>0.9661)lit="";
 else if(Math.abs(p-0.5)<0.0339)lit='<circle cx="50" cy="50" r="45" fill="#F2E7C4"/>';
 else lit='<path d="M50 5 A45 45 0 0 '+outer+' 50 95 A'+rx.toFixed(2)+' 45 0 0 '+inner+' 50 5z" fill="#F2E7C4"/>';
 return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="45" fill="'+dark+'"/>'+lit+'</svg>';
}
function nextPhase(target){var now=Date.now(),p=moonPhase(now),diff=target-p;if(diff<=0.01)diff+=1;return new Date(now+diff*SYN*864e5);}
function tonightSky(){
 var wx=lsGet("wx",null);if(!wx||!wx.hourly)return null;
 var n=new Date(),key=n.getFullYear()+"-"+pad(n.getMonth()+1)+"-"+pad(n.getDate())+"T21:00",i=wx.hourly.time.indexOf(key);
 return i<0?null:wxInfo(wx.hourly.weather_code[i],0).t;
}
function renderMoon(){
 var p=moonPhase(Date.now()),name=phaseName(p),pct=Math.round((1-Math.cos(2*Math.PI*p))/2*100);
 $("tMoon").innerHTML='<div class="mr">'+moonSvg(p,92)+'</div><div class="col"><div class="lbl">Tonight</div><div style="font-size:22px;font-weight:600;margin-top:4px">'+name+'</div><div class="sub" style="font-size:16px">'+pct+'% lit</div></div>';
 var s=sunToday(),sky=tonightSky(),full=nextPhase(0.5),nw=nextPhase(0);
 var stars=pct<=35?"Dark skies tonight, good for stars.":pct>=80?"Bright moon tonight; only the brightest stars will show.":"Some moonlight tonight; stars are fair.";
 $("moonBody").innerHTML='<div class="card row"><div class="mr">'+moonSvg(p,220)+'</div><div class="col"><div style="font-size:40px;font-weight:700">'+name+'</div><div class="sub" style="font-size:22px">'+pct+'% of the moon is lit</div><div class="sub" style="font-size:22px">Next full moon: around '+fmtDay(full)+'</div><div class="sub" style="font-size:22px">Next new moon: around '+fmtDay(nw)+'</div></div></div>'+
  '<div class="card"><div class="lbl" style="margin-bottom:10px">Stars tonight</div><div style="font-size:24px;line-height:1.4">'+stars+(sky?' Sky at 9 PM: '+sky.toLowerCase()+'.':'')+'</div><div class="sub" style="font-size:20px">Sunset '+fmtTime(s.set)+' · dark about an hour after</div></div>';
}

/* ---------- Photo of the day (kept on this iPad only) ---------- */
var db=null,photos=[],photoIdx=0,photoRmArm=false;
function idbOpen(){return new Promise(function(res,rej){if(!window.indexedDB)return rej(new Error("none"));var r=indexedDB.open("home-panel",1);r.onupgradeneeded=function(){r.result.createObjectStore("photos",{keyPath:"id",autoIncrement:true});};r.onsuccess=function(){res(r.result);};r.onerror=function(){rej(r.error);};});}
function idbReq(mode,fn){return new Promise(function(res,rej){var tx=db.transaction("photos",mode),q=fn(tx.objectStore("photos"));tx.oncomplete=function(){res(q&&q.result);};tx.onerror=function(){rej(tx.error);};});}
function idbAll(){return new Promise(function(res,rej){var out=[],tx=db.transaction("photos","readonly"),c=tx.objectStore("photos").openCursor();c.onsuccess=function(e){var cur=e.target.result;if(cur){out.push(cur.value);cur.continue();}else res(out);};c.onerror=function(){rej(c.error);};});}
function todayPhoto(){return photos.length?photos[((dayNum(new Date())%photos.length)+photos.length)%photos.length]:null;}
function renderPhotoTile(){
 var el=$("tPhoto"),p=todayPhoto();
 if(p){el.style.backgroundImage="url("+p.data+")";el.innerHTML='<div class="ptag">Photo of the day</div>';}
 else{el.style.backgroundImage="";el.innerHTML=icon("photo",52)+'<div style="font-size:18px;margin-top:10px;font-weight:600">Photo of the day</div><div style="font-size:16px;margin-top:4px">Tap to add photos</div>';}
}
function renderPhotoView(){
 var big=$("photoBig"),bar=$("photoBar");
 if(!photos.length){big.style.backgroundImage="";big.innerHTML='<div class="center" style="padding-top:120px;font-size:24px;color:#bbb">No photos yet. Tap Add photos and pick some from this iPad.</div>';bar.innerHTML='<button class="btn pri" data-act="padd">Add photos</button>';$("photoTitle").textContent="Photos";return;}
 if(photoIdx>=photos.length)photoIdx=0;
 big.innerHTML="";big.style.backgroundImage="url("+photos[photoIdx].data+")";
 $("photoTitle").textContent="Photo "+(photoIdx+1)+" of "+photos.length;
 bar.innerHTML='<button class="btn" data-act="pprev">Previous</button><button class="btn" data-act="pnext">Next</button><button class="btn pri" data-act="padd">Add photos</button><button class="btn'+(photoRmArm?' warn':'')+'" data-act="prm">'+(photoRmArm?"Tap again to remove":"Remove this one")+'</button>';
}
function shrink(file){
 return new Promise(function(res){
  var fr=new FileReader();
  fr.onload=function(){var img=new Image();img.onload=function(){
    var max=1280,w=img.width,h=img.height,sc=Math.min(1,max/Math.max(w,h)),c=document.createElement("canvas");
    c.width=Math.round(w*sc);c.height=Math.round(h*sc);c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    res(c.toDataURL("image/jpeg",0.82));};img.onerror=function(){res(null);};img.src=fr.result;};
  fr.onerror=function(){res(null);};fr.readAsDataURL(file);
 });
}
$("photoInput").addEventListener("change",function(){
 var files=Array.prototype.slice.call(this.files||[]),added=0,self=this;if(!files.length)return;
 if(!db){toast("Photos can’t be saved on this iPad");return;}
 toast("Adding "+files.length+" photo"+(files.length>1?"s":"")+"…");
 // One at a time so the iPad's small memory isn't swamped.
 var chain=Promise.resolve();
 files.forEach(function(f){chain=chain.then(function(){return shrink(f);}).then(function(data){if(!data)return;return idbReq("readwrite",function(s){return s.add({data:data,added:Date.now()});}).then(function(id){photos.push({id:id,data:data});added++;});});});
 chain.then(function(){self.value="";renderPhotoTile();photoIdx=photos.length-added;renderPhotoView();toast("Added "+added+" photo"+(added===1?"":"s"));})
 .catch(function(){self.value="";renderPhotoTile();renderPhotoView();toast("Some photos didn’t save. The iPad may be full.");});
});

/* ---------- Guest Wi-Fi QR (details stay on this iPad) ---------- */
var wifi=lsGet("wifi",null),wifiEdit=false;
function wifiEsc(s){return String(s).replace(/([\\;,:"])/g,"\\$1");}
function qrSvg(text,px){
 var q=qrcode(0,"M");q.addData(text);q.make();var n=q.getModuleCount(),m=4,path="";
 for(var r=0;r<n;r++)for(var c=0;c<n;c++)if(q.isDark(r,c))path+="M"+(c+m)+" "+(r+m)+"h1v1h-1z";
 var v=n+2*m;
 return '<svg width="'+px+'" height="'+px+'" viewBox="0 0 '+v+' '+v+'" shape-rendering="crispEdges" role="img" aria-label="QR code to join Wi-Fi"><rect width="'+v+'" height="'+v+'" fill="#fff"/><path d="'+path+'" fill="#000"/></svg>';
}
function wifiString(){return "WIFI:T:"+(wifi.sec==="nopass"?"nopass":"WPA")+";S:"+wifiEsc(wifi.ssid)+";"+(wifi.sec==="nopass"?"":"P:"+wifiEsc(wifi.pass)+";")+";";}
function renderWifi(){
 var el=$("tWifi");
 if(wifi&&wifi.ssid)el.innerHTML='<div class="qrbox mr">'+qrSvg(wifiString(),112)+'</div><div class="col"><div class="lbl">Guest Wi-Fi</div><div style="font-size:20px;font-weight:600;margin-top:4px">Scan to join</div><div class="sub" style="font-size:15px;word-break:break-all">'+esc(wifi.ssid)+'</div></div>';
 else el.innerHTML='<div class="mr" style="color:var(--muted)">'+icon("wifi",56)+'</div><div class="col"><div class="lbl">Guest Wi-Fi</div><div style="font-size:20px;font-weight:600;margin-top:4px">Tap to set up</div></div>';
 var b=$("wifiBody");
 if(wifi&&wifi.ssid&&!wifiEdit)b.innerHTML='<div class="card row" style="justify-content:center"><div class="qrbox mr" style="padding:0">'+qrSvg(wifiString(),380)+'</div><div class="col"><div class="lbl">Network</div><div style="font-size:34px;font-weight:700;margin:4px 0 20px;word-break:break-all">'+esc(wifi.ssid)+'</div>'+(wifi.sec==="nopass"?'<div class="sub" style="font-size:22px">No password</div>':'<div class="lbl">Password</div><div style="font-size:34px;font-weight:700;margin-top:4px;word-break:break-all">'+esc(wifi.pass)+'</div>')+'<div class="sub" style="font-size:20px;margin-top:20px">Point your phone’s camera at the code.</div></div></div><button class="btn" data-act="wedit">Change network</button>';
 else b.innerHTML='<div class="card"><div class="sub" style="margin:0 0 18px;font-size:19px">Use your guest network, not your main one. This stays on this iPad; it isn’t uploaded anywhere.</div><label class="field"><span>Network name</span><input id="wSsid" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" value="'+esc(wifi?wifi.ssid:"")+'"></label><label class="field"><span>Password</span><input id="wPass" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" value="'+esc(wifi?wifi.pass:"")+'"></label><label class="field"><span>Security</span><select id="wSec"><option value="WPA">WPA / WPA2 / WPA3 (most networks)</option><option value="nopass"'+(wifi&&wifi.sec==="nopass"?" selected":"")+'>None (open network)</option></select></label><button class="btn pri" data-act="wsave">Save</button>'+(wifi&&wifi.ssid?'<button class="btn" data-act="wcancel">Cancel</button>':'')+'</div>';
}

/* ---------- Views, taps, idle return ---------- */
var view=null,lastTouch=Date.now();
function openView(name){
 if(view)$("v-"+view).className="view";
 view=name;removeArm=null;photoRmArm=false;
 if(name==="timer")renderTimerView();
 if(name==="photo"){var t=todayPhoto();photoIdx=t?photos.indexOf(t):0;renderPhotoView();}
 if(name==="count")renderCount();
 if(name==="wifi"){wifiEdit=false;renderWifi();}
 $("v-"+name).className="view on";$("v-"+name).querySelector(".vbody, #photoBig").scrollTop=0;
}
function closeView(){if(view)$("v-"+view).className="view";view=null;}
document.addEventListener("click",function(e){
 var t=e.target;while(t&&t!==document&&!(t.getAttribute&&(t.hasAttribute("data-open")||t.hasAttribute("data-timer")||t.hasAttribute("data-act")||t.hasAttribute("data-back"))))t=t.parentNode;
 if(!t||t===document)return;
 if(t.hasAttribute("data-back")){if(timer&&timer.ringing){timer=null;}closeView();renderTimerTile();return;}
 if(t.hasAttribute("data-timer")){startTimer(+t.getAttribute("data-timer"));return;}
 if(t.hasAttribute("data-open")){var n=t.getAttribute("data-open");if(n==="photo"&&!photos.length&&db){openView("photo");$("photoInput").click();return;}openView(n);return;}
 var a=t.getAttribute("data-act");
 if(a==="tpause"&&timer){if(timer.paused){timer.end=Date.now()+timer.left;timer.paused=false;}else{timer.left=timeLeft();timer.paused=true;}tickTimer();}
 else if(a==="tadd"&&timer){if(timer.paused)timer.left+=60000;else timer.end+=60000;tickTimer();}
 else if(a==="tcancel"||a==="tstop"){timer=null;closeView();renderTimerTile();}
 else if(a==="cdadd")addCount();
 else if(a==="cdrm"){var id=+t.getAttribute("data-id");if(removeArm===id){countList=countList.filter(function(x){return x.id!==id;});lsSet("cd-list",countList);removeArm=null;toast("Removed");}else removeArm=id;renderCount();}
 else if(a==="padd")$("photoInput").click();
 else if(a==="pprev"){photoIdx=(photoIdx-1+photos.length)%photos.length;photoRmArm=false;renderPhotoView();}
 else if(a==="pnext"){photoIdx=(photoIdx+1)%photos.length;photoRmArm=false;renderPhotoView();}
 else if(a==="prm"){if(photoRmArm){var p=photos[photoIdx];idbReq("readwrite",function(s){return s["delete"](p.id);}).then(function(){photos.splice(photoIdx,1);photoRmArm=false;renderPhotoView();renderPhotoTile();toast("Photo removed");});}else{photoRmArm=true;renderPhotoView();}}
 else if(a==="wedit"){wifiEdit=true;renderWifi();}
 else if(a==="wcancel"){wifiEdit=false;renderWifi();}
 else if(a==="wsave"){var s=($("wSsid").value||"").trim();if(!s){toast("Type the network name");return;}wifi={ssid:s.slice(0,32),pass:$("wPass").value||"",sec:$("wSec").value};lsSet("wifi",wifi);wifiEdit=false;renderWifi();toast("Saved");}
},false);
["touchstart","mousedown","keydown"].forEach(function(ev){document.addEventListener(ev,function(){lastTouch=Date.now();},true);});
// Back to the home screen after 1 minute untouched, unless a timer is on screen.
setInterval(function(){if(view&&Date.now()-lastTouch>60000&&!(view==="timer"&&timer))closeView();},5000);

/* ---------- Start ---------- */
applyTheme();
renderWeather();renderTimerTile();renderWifi();
tickClock();setInterval(tickClock,10000);
setInterval(tickTimer,250);
loadWeather();setInterval(loadWeather,15*60000);
idbOpen().then(function(d){db=d;return idbAll();}).then(function(all){photos=all.map(function(r){return {id:r.id,data:r.data};});renderPhotoTile();}).catch(function(){renderPhotoTile();});
window.addEventListener("resize",function(){fitText($("verseText"),22,14);});
})();
</script>
